services:
  peopleu-continuing-education-service:
    # Vuelve solo cuando Docker Desktop se reinicia. unless-stopped respeta el docker stop a mano.
    restart: unless-stopped
    build:
      # El contexto es la carpeta padre: el Dockerfile copia core-plataform (clonado al lado) y
      # este servicio.
      context: ..
      dockerfile: peopleu-continuing-education-service/Dockerfile
    image: peopleu-continuing-education-service:local
    container_name: peopleu-continuing-education-service
    # Techo de RAM. Sin esto el contenedor puede crecer hasta comerse toda la VM de Docker.
    mem_limit: 1024m
    environment:
      # El JVM lee el mem_limit de arriba y se queda con el 70% para el heap.
      JAVA_TOOL_OPTIONS: "-XX:MaxRAMPercentage=70.0"
      SPRING_PROFILES_ACTIVE: dev
      PU_CONTINUING_EDUCATION_SERVICE_PORT: 8104
      PU_CONTINUING_EDUCATION_DB_URL: jdbc:postgresql://peopleu-continuing-education-postgres:5432/peopleu_continuing_education_service
      PU_CONTINUING_EDUCATION_DB_USER: postgres
      PU_CONTINUING_EDUCATION_DB_PASSWORD: postgres
      # Interruptor del JWT. Los seeds de desarrollo corren sin token.
      JWT_ENABLED: ${JWT_ENABLED:-true}
      IAM_JWT_ISSUER: iam-service
      # Claves publicas de firma de IAM (RS256): el servicio verifica con el JWKS y nunca firma.
      IAM_JWKS_URI: ${IAM_JWKS_URI:-http://host.docker.internal:8080/.well-known/jwks.json}
      IAM_JWT_AUDIENCE: ${IAM_JWT_AUDIENCE:-peopleu-continuing-education-service}
      # Donde vive IAM, para las llamadas que NO nacen de una request de un usuario (token de la
      # cuenta de servicio, canje). Dentro del contenedor, localhost es el propio contenedor.
      IAM_SERVICE_URL: ${IAM_SERVICE_URL:-http://host.docker.internal:8080}
      IAM_REDIS_HOST: ${IAM_REDIS_HOST:-host.docker.internal}
      IAM_REDIS_PORT: ${IAM_REDIS_PORT:-6379}
      # Secreto de la cuenta de servicio peopleu-continuing-education-service en IAM. Vacio hasta que exista la
      # cuenta: el servicio arranca igual y el relay del outbox avisa en el log que no tiene token.
      PU_CONTINUING_EDUCATION_SERVICE_ACCOUNT_CLIENT_SECRET: ${PU_CONTINUING_EDUCATION_SERVICE_ACCOUNT_CLIENT_SECRET:-}
      # Los otros servicios NO estan en esta red (cada compose crea la suya): se llegan por el
      # puerto que publican en el host.
      PU_TRANSVERSAL_SERVICE_URL: ${PU_TRANSVERSAL_SERVICE_URL:-http://host.docker.internal:8101}
      AI_SERVICE_URL: ${AI_SERVICE_URL:-http://host.docker.internal:8091}
      PU_CONTINUING_EDUCATION_CORS_ALLOWED_ORIGINS: ${PU_CONTINUING_EDUCATION_CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000,http://localhost:3001,http://127.0.0.1:3001}
      SPRINGDOC_ENABLED: "true"
    ports:
      - "8104:8104"
    depends_on:
      peopleu-continuing-education-postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "timeout 3 bash -c '</dev/tcp/127.0.0.1/8104'"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
  peopleu-continuing-education-postgres:
    restart: unless-stopped
    image: postgres:16
    container_name: peopleu-continuing-education-postgres
    mem_limit: 512m
    environment:
      POSTGRES_DB: peopleu_continuing_education_service
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "127.0.0.1:5454:5432"
    volumes:
      - peopleu_continuing_education_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d peopleu_continuing_education_service"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  peopleu_continuing_education_postgres_data:
